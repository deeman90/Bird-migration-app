<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0c0d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>BMA (Bird Migration App)</title>
    <meta name="description" content="Global bird migration tracking app with real-time flyway maps, sighting logger with coordinates and photo uploads, community observation feed, regional leaderboards, exclusive paid birding hotspots, and avian conservation donation portal." />
    <meta property="og:title" content="BMA (Bird Migration App)" />
    <meta property="og:description" content="Global bird migration tracking app with real-time flyway maps, sighting logger with coordinates and photo uploads, community observation feed, regional leaderboards, exclusive paid birding hotspots, and avian conservation donation portal." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var origFetch = window.fetch ? window.fetch.bind(window) : undefined;
          var activeFetch = origFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return activeFetch || origFetch;
            },
            set: function(fn) {
              if (typeof fn === 'function') {
                activeFetch = fn;
              }
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {}

        window.addEventListener('error', function(event) {
          if (event && event.message && event.message.indexOf('Cannot set property fetch') !== -1) {
            if (event.preventDefault) event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
  </head>
  <body class="bg-[#0b0c0d] text-[#edeeef] font-sans antialiased selection:bg-[#00ffaa] selection:text-[#0b0c0d]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
